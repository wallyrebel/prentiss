name: RSS to WordPress Automation

on:
  schedule:
    # Four runs/day, away from the top of the hour. UTC; 72-hour source window.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Review only; do not publish or change dedupe state
        default: true
        type: boolean
      single_feed:
        description: Optional exact feed name from feeds.yaml
        default: ''
        type: string

permissions:
  contents: read

# Scheduled and manual runs share one writer and one database.
concurrency:
  group: prentiss-wordpress-publisher
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A feature branch may be reviewed, but never publish using production secrets.
    if: github.ref == 'refs/heads/main' || inputs.dry_run == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test editorial gates before any publishing
        run: python -m pytest -q
      - run: mkdir -p data
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-db-v2-
            processed-db-
      - name: Review and publish qualifying articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4.1-mini' }}
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          TIMEZONE: America/Chicago
          USE_STOCK_IMAGES: 'false'
          DRY_RUN: ${{ inputs.dry_run || false }}
          SINGLE_FEED: ${{ inputs.single_feed }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--config feeds.yaml --hours 72)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SINGLE_FEED" ]]; then args+=(--single-feed "$SINGLE_FEED"); fi
          python -m rss_to_wp run "${args[@]}"
      - name: Preserve database even after partial failure
        if: always() && inputs.dry_run != true && github.ref == 'refs/heads/main' && hashFiles('data/processed.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save editorial decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-decisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/run-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('data/run-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Editorial publishing results\n\n')
              if report.exists():
                  data = json.loads(report.read_text())
                  out.write(f"Dry run: {data['dry_run']}\n\n")
                  for status, count in data['summary'].items():
                      out.write(f'- {status}: {count}\n')
                  out.write('\nSee the editorial-decisions artifact for sources and rejection reasons.\n')
              else:
                  out.write('No editorial report: inspect the failed setup or test step.\n')
          PY
