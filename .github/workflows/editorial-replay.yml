name: Editorial diagnostic replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Replay retained October 3 source group without publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
        run: python -m rss_to_wp.replay --snapshot tests/fixtures/oct3_editorial_replay.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editorial-diagnostic-replay
          path: data/editorial-replay.json
          retention-days: 14
