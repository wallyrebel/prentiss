name: Editorial diagnostic replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Read exact retained review input from confirmed budget failure
        uses: actions/download-artifact@v6
        with:
          name: editorial-decisions-37155073138-1
          run-id: '37155073138'
          github-token: ${{ github.token }}
          path: data/retained-run/
      - name: Extract one failed review without changing its sources or draft
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/retained-run/run-report.json').read_text())
          failures = [row for row in report['decisions']
                      if row.get('diagnostics', {}).get('stage') == 'review'
                      and row.get('diagnostics', {}).get('code') == 'incomplete_response']
          if len(failures) != 1 or not failures[0]['replay'].get('review_request', {}).get('article'):
              raise SystemExit('Expected one retained review request')
          Path('data/review-snapshot.json').write_text(json.dumps(failures[0]['replay']))
          PY
      - name: Replay exact retained review without publishing or rewriting
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
        run: python -m rss_to_wp.replay --snapshot data/review-snapshot.json
      - name: Verify reviewer still accepts facts and rejects changed schedules
        env:
          RUN_LIVE_EDITORIAL_EVALS: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
        run: python -m pytest tests/test_live_editorial.py -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editorial-diagnostic-replay
          path: data/editorial-replay.json
          retention-days: 14
