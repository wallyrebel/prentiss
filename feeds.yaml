# Sources retain their original feed names for manual workflow compatibility.
# Category routing preserves existing permalink behavior.
category_rules:
- pattern: \bBooneville\b
  category: Booneville MS News
- pattern: ^(?!.*\bBooneville\b).*\b(Baldwyn|Jumpertown|Marietta(?!,\s*(?:GA|Georgia)\b)|New
    Site|Thrasher|Wheeler)\b
